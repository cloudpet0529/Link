<!doctype html><html lang="ko"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>LINK v0.4</title><script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script><style>*{box-sizing:border-box}body{margin:0;background:#f4f6fa;color:#142139;font:16px system-ui}main{max-width:650px;margin:auto;padding:20px}section{background:white;border-radius:20px;padding:20px;margin:16px 0}header{font-size:36px;font-weight:900}header span{color:#3975ff}.hero{background:#142139;color:white}button,input{font:inherit;border-radius:12px;padding:14px;border:1px solid #dce1eb}button{cursor:pointer;background:#e9eef7}button.primary{background:#3975ff;color:white;width:100%;border:0;font-weight:bold}input,video{width:100%;margin:8px 0}video{border-radius:12px}small,p{line-height:1.6}a{color:#235ac8} [hidden]{display:none!important}.item{border-bottom:1px solid #ddd;padding:12px 0;overflow-wrap:anywhere}</style><main><header>LINK<span>.</span></header><section class="hero"><small>ONE SCAN, EVERYTHING.</small><h1>물건을 비추면,<br>정보가 연결됩니다.</h1><button class="primary" id="start">◎ 자동 스캔 시작</button></section><section id="camera" hidden><video id="video" autoplay muted playsinline></video><p id="status" role="status"></p><button id="stop">스캔 종료</button></section><section><h2>모델 확인</h2><p id="hint">제품 라벨의 모델명을 비추거나 직접 입력하세요.</p><div id="candidates"></div><input id="model" placeholder="예: SM-R177" maxlength="120"><button class="primary" id="confirm">제품 확인</button></section><section id="result" hidden><small id="verified"></small><h2 id="name"></h2><p id="details"></p><a id="official" target="_blank" rel="noopener">제조사 공식 지원 사이트</a><p><a id="search" target="_blank" rel="noopener">모델명으로 설명서 검색</a></p><button class="primary" id="save">내 물건에 저장</button></section><section><h2>내 물건</h2><div id="saved"></div></section><small>v0.4 · 테스트 버전. 외형 AI 인식 및 공식 설명서 데이터 연동은 미구현. 위험한 수리는 전문가에게 문의하세요. 라벨의 일련번호나 개인정보는 저장하지 마세요.</small></main><script>
const $=id=>document.getElementById(id);const catalog={'SM-R177':{name:'Samsung Galaxy Buds2',brand:'Samsung',url:'https://www.samsung.com/sec/support/'},'SM-R190':{name:'Samsung Galaxy Buds Pro',brand:'Samsung',url:'https://www.samsung.com/sec/support/'},'SM-R510':{name:'Samsung Galaxy Buds2 Pro',brand:'Samsung',url:'https://www.samsung.com/sec/support/'}};let stream=null,worker=null,session=0,current='',busy=false;const video=$('video');function stop(){session++;if(stream)stream.getTracks().forEach(t=>t.stop());stream=null;video.srcObject=null;$('camera').hidden=true;$('start').disabled=false;}function candidates(text){return [...new Set((text.toUpperCase().replace(/[–—]/g,'-').match(/\b[A-Z]{1,6}-[A-Z0-9]{2,12}\b/g)||[]).filter(x=>/\d/.test(x)))].slice(0,8)}function showCandidates(list){$('candidates').replaceChildren();for(const x of list){const b=document.createElement('button');b.textContent=x;b.onclick=()=>{$('model').value=x;show(x)};$('candidates').append(b)}}async function start(){if(busy||stream)return;busy=true;const token=++session;$('start').disabled=true;$('camera').hidden=false;$('status').textContent='카메라 연결 중';try{const s=await navigator.mediaDevices.getUserMedia({video:{facingMode:{ideal:'environment'}},audio:false});if(token!==session){s.getTracks().forEach(t=>t.stop());return}stream=s;video.srcObject=s;await video.play();$('status').textContent='문자 인식 엔진 준비 중';if(!worker)worker=await Tesseract.createWorker('eng');if(token!==session)return;let last='',hits=0;while(token===session&&stream){$('status').textContent='모델명 라벨을 선명하게 비춰주세요.';const c=document.createElement('canvas');c.width=video.videoWidth;c.height=video.videoHeight;if(!c.width){await new Promise(r=>setTimeout(r,500));continue}c.getContext('2d').drawImage(video,0,0);const r=await worker.recognize(c);if(token!==session)return;const list=candidates(r.data.text);showCandidates(list);const known=list.filter(x=>catalog[x]);if(known.length===1){hits=last===known[0]?hits+1:1;last=known[0];if(hits>=2){$('model').value=last;show(last);return}}else{hits=0;last=''}if(list.length){$('hint').textContent='후보를 확인하세요. 등록되지 않은 모델은 자동 확정하지 않습니다.';$('status').textContent='모델명 후보 발견 · 아래에서 선택 가능';}await new Promise(r=>setTimeout(r,900))}}catch(e){if(token===session){stop();$('hint').textContent='스캔 실패: 카메라 권한과 인터넷 연결을 확인하세요.'}}finally{busy=false;$('start').disabled=false}}
function show(x){x=x.trim().toUpperCase();if(!x)return;stop();current=x;const p=catalog[x];$('result').hidden=false;$('verified').textContent=p?'내장 테스트 목록과 일치 · 실제 라벨 확인 필요':'미등록 모델 · 제품 미확인';$('name').textContent=p?p.name:x;$('details').textContent=p?'모델 후보: '+x+' · 공식 지원 사이트에서 제품을 확인하세요.':'공식 제품 정보가 아직 없습니다. 모델명을 확인하세요.';$('official').hidden=!p;if(p)$('official').href=p.url;$('search').href='https://www.google.com/search?q='+encodeURIComponent(x+' 공식 사용 설명서');$('result').scrollIntoView({behavior:'smooth'})}function items(){try{const a=JSON.parse(localStorage.getItem('linkProducts')||'[]');return Array.isArray(a)?a.filter(x=>typeof x==='string'):[]}catch{return []}}function store(a){try{localStorage.setItem('linkProducts',JSON.stringify(a));render()}catch{alert('저장할 수 없습니다.')}}function render(){const a=items();$('saved').replaceChildren();if(!a.length)$('saved').textContent='등록된 물건이 없습니다.';a.forEach((x,i)=>{const d=document.createElement('div');d.className='item';const p=document.createElement('p');p.textContent=x;const b=document.createElement('button');b.textContent='정보 보기';b.onclick=()=>show(x);const del=document.createElement('button');del.textContent='삭제';del.onclick=()=>store(a.filter((_,j)=>j!==i));d.append(p,b,del);$('saved').append(d)})}$('start').onclick=start;$('stop').onclick=stop;$('confirm').onclick=()=>show($('model').value);$('save').onclick=()=>{if(!current)return;const a=items();if(!a.includes(current))store([...a,current]);};window.addEventListener('pagehide',stop);render();</script></html>
